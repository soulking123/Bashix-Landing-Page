  <path d="M22 18H34C37.5 18 40.5 20.5 40.5 24C40.5 26.5 39 28.5 37 29.5C40 30.5 42 33 42 36.5C42 40.5 38.5 43 34 43H22V18Z" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="22" y1="30.5" x2="36" y2="30.5" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" />
